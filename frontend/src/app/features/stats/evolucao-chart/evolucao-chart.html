<div class="chart-wrap">
  <svg viewBox="0 0 640 220" role="img" aria-labelledby="evolucao-titulo evolucao-descricao">
    <title id="evolucao-titulo">Evolução semanal do aproveitamento</title>
    <desc id="evolucao-descricao">
      Percentual de acerto e volume de questões nas últimas oito semanas. Semanas sem atividade
      aparecem como lacunas.
    </desc>
    @for (linha of [0, 25, 50, 75, 100]; track linha) {
      <line
        x1="30"
        x2="628"
        [attr.y1]="190 - linha * 1.5"
        [attr.y2]="190 - linha * 1.5"
        class="grade"
      />
      <text x="0" [attr.y]="194 - linha * 1.5">{{ linha }}%</text>
    }
    @for (barra of barras(); track $index) {
      <rect
        [attr.x]="barra.x"
        [attr.y]="barra.y"
        width="30"
        [attr.height]="barra.altura"
        class="barra"
        rx="2"
      />
    }
    <path [attr.d]="areaPath()" class="area" />
    <path [attr.d]="linePath()" class="linha" />
    @for (ponto of pontos(); track ponto.semana) {
      <circle [attr.cx]="ponto.x" [attr.cy]="ponto.y" r="4" class="ponto" tabindex="0">
        <title>{{ ponto.semana }}: {{ ponto.pct }}%</title>
      </circle>
      <text [attr.x]="ponto.x" [attr.y]="ponto.y - 10" text-anchor="middle" class="rotulo">
        {{ ponto.pct }}%
      </text>
    }
    @for (semana of evolucao().semanas; track semana.semana; let indice = $index) {
      <text [attr.x]="semanasX(indice)" y="212" text-anchor="middle" class="eixo">
        {{ semana.rotulo }}
      </text>
    }
  </svg>
</div>
<table class="table" aria-label="Dados da evolução semanal">
  <thead>
    <tr>
      <th>Semana</th>
      <th>Aproveitamento</th>
      <th>Questões</th>
    </tr>
  </thead>
  <tbody>
    @for (linha of serie(); track linha.semana) {
      <tr>
        <td>{{ linha.semana }}</td>
        <td>{{ linha.percentual }}</td>
        <td>{{ linha.volume }}</td>
      </tr>
    }
  </tbody>
</table>
