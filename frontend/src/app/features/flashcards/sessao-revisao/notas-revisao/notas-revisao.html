<div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px">
  @for (botao of botoes(); track botao.nota) {
    <button
      type="button"
      (click)="classificar.emit(botao.nota)"
      [style]="
        'display:flex;flex-direction:column;align-items:center;gap:2px;padding:11px 6px;border:1px solid ' +
        botao.cor +
        ';border-radius:var(--radius-md);background:color-mix(in srgb,' +
        botao.cor +
        ' 8%,transparent);color:' +
        botao.cor +
        ';cursor:pointer;font-family:var(--font-body)'
      "
    >
      <span style="font-family: var(--font-heading); font-size: 14px">{{ botao.label }}</span>
      <span style="font-size: 11px">{{ botao.intervalo }}</span>
      <span style="font-size: 10px">{{ botao.atalho }}</span>
    </button>
  }
</div>
