<div
  style="
    border: 1px dashed var(--color-divider);
    border-radius: var(--radius-lg);
    padding: 40px;
    text-align: center;
  "
>
  <i class="ph ph-coffee" style="font-size: 28px; color: var(--color-neutral-500)"></i>
  <div style="font-family: var(--font-heading); font-size: 17px; margin: 10px 0 6px">
    Nada vencido por hoje
  </div>
  <div style="font-size: 13px; color: var(--color-neutral-400); margin-bottom: 16px">
    Seus cards voltam à fila conforme o agendamento da repetição espaçada.
  </div>
  <button
    class="btn btn-secondary"
    type="button"
    (click)="voltar.emit()"
    style="border-color: var(--color-divider)"
  >
    Ver todos os cards
  </button>
</div>
