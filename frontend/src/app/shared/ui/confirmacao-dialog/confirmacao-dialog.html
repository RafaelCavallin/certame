<div class="dialog-backdrop" role="presentation">
  <section class="dialog" role="alertdialog" aria-modal="true" [attr.aria-label]="titulo()">
    <h2 class="dialog-title">{{ titulo() }}</h2>
    <p class="dialog-body">{{ mensagem() }}</p>
    <div class="dialog-actions">
      <button class="btn btn-secondary" type="button" (click)="cancelado.emit()">Cancelar</button
      ><button class="btn btn-primary" type="button" (click)="confirmado.emit()">
        {{ varianteArquivar() ? 'Arquivar' : confirmarLabel() }}
      </button>
    </div>
  </section>
</div>
