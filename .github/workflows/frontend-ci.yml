name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Formato, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar formatação
        run: npm run format:check

      # Usa `npm test`, não `npm run test:coverage`: a métrica de functions
      # está em 79,62%, abaixo do limiar de 80% do angular.json, sobretudo
      # porque o v8 conta cada binding de template .html como uma função.
      # Habilitar o gate depende de decidir se templates entram na métrica.
      - name: Testes
        run: npm test

      - name: Build de produção
        run: npm run build
