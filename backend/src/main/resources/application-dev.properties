spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55432}/${DB_NAME:certame_dev}
spring.datasource.username=${DB_USER:certame}
spring.datasource.password=${DB_PASSWORD:certame}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:55525}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.flyway.locations=classpath:db/migration,classpath:db/migration-dev
# Seeds de dev usam versoes altas (900+) para rodar por ultimo; permite aplicar
# migrations "reais" criadas depois que os seeds ja rodaram localmente.
spring.flyway.out-of-order=true

# Segredo fixo apenas para desenvolvimento local; nunca usar em staging/prod.
certame.seguranca.jwt-segredo=${JWT_SECRET:certame-dev-segredo-nao-prod-2026-32bytes}
certame.cors.origem=${SPA_ORIGIN:http://localhost:4200}
certame.seguranca.frontend-url=${SPA_ORIGIN:http://localhost:4200}
certame.seguranca.cookie-secure=false
